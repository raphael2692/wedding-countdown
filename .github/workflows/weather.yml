name: Aggiorna previsioni meteo

on:
  # Ogni 4 ore tra le 6:00 e le 24:00 (ora italiana).
  # GitHub Actions usa SEMPRE UTC: 04,08,12,16,20 UTC = 06,10,14,18,22 in ora legale (CEST),
  # cioè il periodo che comprende il 12 settembre 2026.
  # In ora solare (CET, da fine ottobre a fine marzo) gli orari slittano a 05,09,13,17,21.
  schedule:
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-weather.js'
      - '.github/workflows/weather.yml'

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scarica le previsioni da Open-Meteo
        run: node scripts/fetch-weather.js

      - name: Commit dei dati aggiornati
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nelle previsioni."
          else
            git commit -m "meteo: aggiornamento previsioni Tragliata ($(TZ=Europe/Rome date '+%d/%m/%Y %H:%M'))"
            git push
          fi
